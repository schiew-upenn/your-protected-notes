# One-click deploy: https://render.com -> New -> Blueprint -> this repo.
# Free tier sleeps when idle; first call after a nap takes ~30s.
services:
  - type: web
    name: your-protected-notes
    runtime: python
    plan: free
    # mcp<2 pin in BOTH places (buildCommand bypasses pyproject) — lineage lesson from your-first-memory.
    buildCommand: pip install "mcp[cli]>=1.2,<2" "psycopg[binary]>=3.1" "PyJWT[crypto]>=2.8"
    startCommand: python server.py
    envVars:
      - key: DATABASE_URL
        sync: false   # Neon -> your project -> Connect: the postgresql:// string
      - key: NEON_AUTH_URL
        sync: false   # Neon -> your project -> Settings -> Better Auth: "Auth URL" (ADR-0003; replaces the Stack keys)
      - key: PUBLIC_URL
        sync: false   # YOUR service URL, e.g. https://<your-service>.onrender.com — the login/OAuth endpoints advertise this;
                      # also add it under Neon -> Settings -> Better Auth -> Domains, or sign-in is refused
